<svg xmlns="http://www.w3.org/2000/svg" width="680" height="780" viewBox="0 0 680 780" role="img" aria-label="答题界面示意：选择 D 通辽市答错后，同时展示正确项与错选项的解析">
  <title>行政区划刷题 · 答题界面示意</title>
  <defs>
    <clipPath id="frame">
      <rect width="680" height="780" rx="18" />
    </clipPath>
    <style>
      text { font-family: 'Inter', 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="680" height="780" fill="#f7f7f5" />

    <!-- 顶栏 -->
    <rect width="680" height="56" fill="#ffffff" />
    <line x1="0" y1="56" x2="680" y2="56" stroke="#e5e5e1" />
    <rect x="28" y="16" width="24" height="24" rx="7" fill="#15171c" />
    <text x="40" y="33" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">地</text>
    <text x="62" y="33" font-size="14" font-weight="600" fill="#15171c">行政区划刷题</text>

    <rect x="466" y="16" width="52" height="24" rx="8" fill="#f1f1ee" />
    <text x="492" y="32" font-size="13" font-weight="600" fill="#15171c" text-anchor="middle">练习</text>
    <text x="528" y="33" font-size="13" fill="#5c6472">错题本</text>
    <rect x="570" y="19" width="18" height="16" rx="5" fill="#4338ca" />
    <text x="579" y="31" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
    <text x="598" y="33" font-size="13" fill="#5c6472">数据</text>

    <!-- 状态条 -->
    <rect x="28" y="78" width="64" height="24" rx="7" fill="#15171c" />
    <text x="60" y="94" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">练习模式</text>
    <text x="104" y="94" font-size="13" fill="#8d95a3">第 3 题</text>
    <text x="172" y="94" font-size="13" fill="#8d95a3">对 2</text>
    <text x="222" y="94" font-size="13" fill="#8d95a3">错 0</text>
    <text x="612" y="95" font-size="15" font-weight="600" fill="#5c6472" text-anchor="end">12</text>
    <text x="616" y="95" font-size="11" fill="#8d95a3">s</text>

    <!-- 每题进度条 -->
    <rect x="28" y="110" width="624" height="2" rx="1" fill="#e5e5e1" />
    <rect x="28" y="110" width="374" height="2" rx="1" fill="#4338ca" />

    <!-- 题干 -->
    <text x="28" y="166" font-size="30" font-weight="600" fill="#15171c" letter-spacing="-0.4">下列哪个地级行政区属于</text>
    <text x="364" y="166" font-size="30" font-weight="600" fill="#4338ca" letter-spacing="-0.4">辽宁省</text>

    <!-- 选项 A -->
    <g opacity="0.45">
      <rect x="28" y="192" width="624" height="62" rx="12" fill="#ffffff" stroke="#e5e5e1" />
      <rect x="48" y="208" width="30" height="30" rx="9" fill="#f1f1ee" />
      <text x="63" y="228" font-size="13" font-weight="600" fill="#5c6472" text-anchor="middle">A</text>
      <text x="94" y="230" font-size="19" font-weight="500" fill="#15171c">阳江市</text>
    </g>

    <!-- 选项 B -->
    <g opacity="0.45">
      <rect x="28" y="264" width="624" height="62" rx="12" fill="#ffffff" stroke="#e5e5e1" />
      <rect x="48" y="280" width="30" height="30" rx="9" fill="#f1f1ee" />
      <text x="63" y="300" font-size="13" font-weight="600" fill="#5c6472" text-anchor="middle">B</text>
      <text x="94" y="302" font-size="19" font-weight="500" fill="#15171c">芜湖市</text>
    </g>

    <!-- 选项 C：正确答案 -->
    <rect x="28" y="336" width="624" height="62" rx="12" fill="#e8f5ed" stroke="#157f45" />
    <rect x="48" y="352" width="30" height="30" rx="9" fill="#157f45" />
    <text x="63" y="372" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">C</text>
    <text x="94" y="374" font-size="19" font-weight="500" fill="#15171c">抚顺市</text>

    <!-- 选项 D：选错项 -->
    <rect x="28" y="408" width="624" height="62" rx="12" fill="#fbecea" stroke="#c0392b" />
    <rect x="48" y="424" width="30" height="30" rx="9" fill="#c0392b" />
    <text x="63" y="444" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">D</text>
    <text x="94" y="446" font-size="19" font-weight="500" fill="#15171c">通辽市</text>

    <!-- 解析反馈 -->
    <rect x="28.5" y="494.5" width="623" height="261" rx="17.5" fill="#fbecea" stroke="#c0392b" stroke-opacity="0.22" />
    <rect x="29" y="512" width="3" height="226" rx="1.5" fill="#c0392b" />
    <text x="56" y="532" font-size="16" font-weight="600" fill="#c0392b">答错了 · 正确答案是 抚顺市</text>

    <!-- 正确项解析 -->
    <rect x="52" y="550" width="576" height="50" rx="10" fill="#ffffff" />
    <rect x="52" y="553" width="3" height="44" rx="1.5" fill="#157f45" />
    <circle cx="75" cy="571" r="9" fill="#157f45" />
    <text x="75" y="575" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="94" y="575" font-size="15" font-weight="600" fill="#157f45">抚顺市</text>
    <text x="139" y="575" font-size="15" fill="#15171c">是辽宁省下辖的地级市。</text>

    <!-- 错选项解析 -->
    <rect x="52" y="608" width="576" height="50" rx="10" fill="#ffffff" />
    <rect x="52" y="611" width="3" height="44" rx="1.5" fill="#c0392b" />
    <circle cx="75" cy="629" r="9" fill="#c0392b" />
    <text x="75" y="633" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">✗</text>
    <text x="94" y="633" font-size="15" font-weight="600" fill="#c0392b">通辽市</text>
    <text x="139" y="633" font-size="15" fill="#15171c">是内蒙古自治区下辖的地级市。</text>

    <text x="52" y="678" font-size="13" fill="#8d95a3">已加入错题本</text>

    <rect x="52" y="694" width="150" height="40" rx="10" fill="#4338ca" />
    <text x="76" y="719" font-size="15" font-weight="600" fill="#ffffff">下一题</text>
    <rect x="136" y="703" width="56" height="22" rx="6" fill="#ffffff" fill-opacity="0.18" />
    <text x="164" y="718" font-size="11" fill="#ffffff" fill-opacity="0.9" text-anchor="middle">Enter</text>
  </g>
</svg>